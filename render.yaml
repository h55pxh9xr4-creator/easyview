services:
  - type: web
    name: easyview-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/easyview.db
    disk:
      name: easyview-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
